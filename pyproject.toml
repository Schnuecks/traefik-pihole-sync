[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traefik-pihole-sync"
dynamic = ["version"]
description = "Sync hostnames from Traefik routers into Pi-hole v6 local DNS records"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.scripts]
traefik-pihole-sync = "traefik_pihole_sync.main:main"

[tool.setuptools]
packages = ["traefik_pihole_sync"]

[tool.setuptools.dynamic]
version = { attr = "traefik_pihole_sync.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
